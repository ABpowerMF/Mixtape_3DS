name: Build Mixtape DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded zips
        run: |
          ZIPS=$(find . -name "*.zip" -not -path "./.git/*")
          if [ -n "$ZIPS" ]; then
            which unzip || (apt-get update && apt-get install -y unzip)
            mkdir -p unpacked
            for z in $ZIPS; do
              echo "Unpacking $z"
              unzip -o "$z" -d unpacked
            done
          fi

      - name: Check 3DS libraries
        run: ls $DEVKITPRO/portlibs/3ds/include/mpg123.h $DEVKITPRO/libctru/include/citro2d.h

      - name: Build
        run: |
          MK=$(find . -name Makefile -not -path "./.git/*" | head -n 1)
          if [ -z "$MK" ]; then
            echo "No Makefile found in the repo or in any zip."
            exit 1
          fi
          DIR=$(dirname "$MK")
          echo "Building in $DIR"
          make -C "$DIR"
          cp "$DIR/MixtapeDS.3dsx" .

      - name: Upload MixtapeDS.3dsx
        uses: actions/upload-artifact@v4
        with:
          name: MixtapeDS
          path: MixtapeDS.3dsx
