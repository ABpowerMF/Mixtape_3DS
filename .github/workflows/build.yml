name: Build Mixtape DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Check 3DS libraries
        run: ls $DEVKITPRO/portlibs/3ds/include/mpg123.h $DEVKITPRO/libctru/include/citro2d.h

      - name: Build
        run: make -C MixtapeDS

      - name: Upload MixtapeDS.3dsx
        uses: actions/upload-artifact@v4
        with:
          name: MixtapeDS
          path: MixtapeDS/MixtapeDS.3dsx
